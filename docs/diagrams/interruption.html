<text x="40" y="88" fill="#2d3142" font-size="28" font-weight="600">打断必须同时停止服务端与终端播放</text><text x="40" y="124" font-size="12" fill="#4f5d75" text-anchor="start">每个会话由一个协调器写入音频；取消不是旧任务已停止的证明。</text><line x1="180" y1="188" x2="180" y2="656" stroke="#4f5d75" opacity=".25" stroke-dasharray="3,3"/><line x1="480" y1="188" x2="480" y2="656" stroke="#4f5d75" opacity=".25" stroke-dasharray="3,3"/><line x1="1040" y1="188" x2="1040" y2="656" stroke="#4f5d75" opacity=".25" stroke-dasharray="3,3"/><path d="M 480 204 H 1040" fill="none" stroke="#2e5aa8" stroke-width="1.5"  marker-end="url(#arrow-link)"/><rect x="648.0" y="176" width="224" height="20" rx="2" fill="#f5f5f5"/><text x="760" y="191" font-size="12" fill="#4f5d75" text-anchor="middle">合成请求 · epoch 7</text><path d="M 1040 264 H 480" fill="none" stroke="#4f5d75" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/><rect x="648.0" y="236" width="224" height="20" rx="2" fill="#f5f5f5"/><text x="760" y="251" font-size="12" fill="#4f5d75" text-anchor="middle">返回音频 · epoch 7</text><path d="M 480 324 H 180" fill="none" stroke="#4f5d75" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="226.0" y="296" width="208" height="20" rx="2" fill="#f5f5f5"/><text x="330" y="311" font-size="12" fill="#4f5d75" text-anchor="middle">播放音频 · epoch 7</text><path d="M 180 380 H 480" fill="none" stroke="#4f5d75" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/><rect x="226.0" y="352" width="208" height="20" rx="2" fill="#f5f5f5"/><text x="330" y="367" font-size="12" fill="#4f5d75" text-anchor="middle">用户起音 · VAD事件</text><path d="M 480 412 H 540 Q 548 412 548 420 V 432 Q 548 440 540 440 H 480" fill="none" stroke="#eb6c36" stroke-width="1.5"  marker-end="url(#arrow-accent)"/><rect x="556" y="416" width="204" height="20" fill="#f5f5f5"/><text x="560" y="431" font-size="12" fill="#4f5d75" text-anchor="start">epoch 8；旧输出失效</text><path d="M 480 476 H 1040" fill="none" stroke="#4f5d75" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/><rect x="656.0" y="448" width="208" height="20" rx="2" fill="#f5f5f5"/><text x="760" y="463" font-size="12" fill="#4f5d75" text-anchor="middle">取消旧合成 · epoch 7</text><path d="M 480 520 H 180" fill="none" stroke="#4f5d75" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/><rect x="226.0" y="492" width="208" height="20" rx="2" fill="#f5f5f5"/><text x="330" y="507" font-size="12" fill="#4f5d75" text-anchor="middle">STOP 8 · 清空队列</text><rect x="448" y="544" width="624" height="112" rx="4" fill="rgba(45,49,66,.02)" stroke="#2d3142" opacity=".65"/><rect x="448" y="544" width="44" height="20" rx="2" fill="#f5f5f5" stroke="#4f5d75"/><text x="470" y="559" font-size="12" fill="#4f5d75" text-anchor="middle">OPT</text><text x="504" y="566" font-size="12" fill="#4f5d75" text-anchor="start">[旧任务忽略取消，仍有迟到音频]</text><path d="M 1040 604 H 480" fill="none" stroke="#4f5d75" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/><rect x="660.0" y="576" width="200" height="20" rx="2" fill="#f5f5f5"/><text x="760" y="591" font-size="12" fill="#4f5d75" text-anchor="middle">迟到音频 · epoch 7</text><path d="M 480 624 H 540 Q 548 624 548 632 V 640 Q 548 648 540 648 H 480" fill="none" stroke="#4f5d75" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="556" y="624" width="240" height="20" fill="#f5f5f5"/><text x="560" y="639" font-size="12" fill="#4f5d75" text-anchor="start">7 ≠ 8，丢弃；不得继续播放</text><rect x="80" y="140" width="200" height="48" rx="6" fill="#f5f5f5" stroke="#4f5d75"/><text x="180" y="170" font-size="16" fill="#2d3142" text-anchor="middle">网站 / Genesys</text><rect x="380" y="140" width="200" height="48" rx="6" fill="#f5f5f5" stroke="#4f5d75"/><text x="480" y="170" font-size="16" fill="#2d3142" text-anchor="middle">Gateway</text><rect x="940" y="140" width="200" height="48" rx="6" fill="#f5f5f5" stroke="#4f5d75"/><text x="1040" y="170" font-size="16" fill="#2d3142" text-anchor="middle">TTS 服务</text><line x1="40" y1="668" x2="1240" y2="668" stroke="#2d3142" opacity=".12"/><text x="40" y="696" font-size="12" fill="#4f5d75" text-anchor="start">虚线实心头：返回；虚线空心头：单向事件。stop 后还需检查浏览器队列与Genesys播放反馈。</text></svg></figure></body></html>
