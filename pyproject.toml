[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "dh-speech-gateway"
version = "0.1.0"
description = "Private speech gateway PoC for website and Genesys protocol v2"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi==0.143.0", "uvicorn==0.54.0", "python-dotenv==1.2.4", "httpx==0.28.1", "numpy==1.26.4", "scipy==1.17.1", "soundfile==0.14.0", "websockets==17.2", "pipecat-ai==0.0.102"]

[project.optional-dependencies]
test = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
speech_gateway = ["web/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
